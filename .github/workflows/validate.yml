name: Validate platform
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Gitleaks
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --redact --no-banner
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          bash scripts/install-ci-kubectl.sh
      - run: make test
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned OpenTofu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tools
          gh release download v1.13.9 --repo opentofu/opentofu --dir tools \
            --pattern 'tofu_1.13.9_linux_amd64.zip' --pattern 'tofu_1.13.9_SHA256SUMS'
          (cd tools && sha256sum --ignore-missing --check tofu_1.13.9_SHA256SUMS && unzip -q tofu_1.13.9_linux_amd64.zip tofu)
          echo "TOFU_BIN=$PWD/tools/tofu" >> "$GITHUB_ENV"
      - name: Format and validate the LocalStack lab
        run: |
          set -euo pipefail
          "$TOFU_BIN" fmt -check -recursive infra
          bash scripts/aws-lab.sh validate
