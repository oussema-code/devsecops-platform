apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-staging
resources:
- ../../base
- namespace.yaml
- resource-quota.yaml
replicas:
- name: adservice
  count: 1
- name: shippingservice
  count: 1
- name: checkoutservice
  count: 1
- name: currencyservice
  count: 1
- name: emailservice
  count: 1
- name: productcatalogservice
  count: 1
- name: frontend
  count: 0  # Deployment is the Rollout's template only
- name: recommendationservice
  count: 1
- name: loadgenerator
  count: 1
- name: cartservice
  count: 1
- name: redis-cart
  count: 1
- name: paymentservice
  count: 1
patches:
- target:
    group: argoproj.io
    kind: Rollout
    name: frontend
  patch: |
    - op: replace
      path: /spec/replicas
      value: 1
