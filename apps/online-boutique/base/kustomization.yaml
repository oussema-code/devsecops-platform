- target:
    kind: Deployment
    name: checkoutservice
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: checkoutservice
    spec:
      template:
        spec:
          containers:
            - name: server
              env:
                - {name: ENABLE_TRACING, value: "1"}
                - {name: COLLECTOR_SERVICE_ADDR, value: "otel.monitoring.svc:4317"}
                - {name: OTEL_SERVICE_NAME, value: "checkoutservice"}
          automountServiceAccountToken: false
          securityContext:
