apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- workloads.yaml
- redis-volume.yaml
- network-policies.yaml
- telemetry-policies.yaml
patches:
- target:
    kind: Deployment
    name: adservice
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: adservice
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 30
          topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app: adservice
- target:
    kind: Deployment
    name: shippingservice
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: shippingservice
    spec:
