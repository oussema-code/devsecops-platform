apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: canary-check
spec:
  podSelector:
    matchLabels:
      app: canary-check
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-canary-check
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: canary-check
    ports:
    - protocol: TCP
      port: 8080
