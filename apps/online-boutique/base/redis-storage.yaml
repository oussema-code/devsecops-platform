apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cart
spec:
  strategy:
    type: Recreate
  template:
    spec:
      volumes:
        - name: redis-data
          emptyDir: null
          persistentVolumeClaim:
            claimName: redis-cart-data
      containers:
        - name: redis
          args: ["redis-server", "--dir", "/data", "--save", "60", "1"]
