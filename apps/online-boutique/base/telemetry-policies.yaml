apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-probe
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: probe
    ports:
    - port: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: export-traces
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - frontend
      - checkoutservice
      - productcatalogservice
      - recommendationservice
      - emailservice
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: otel
    ports:
    - port: 4317
      protocol: TCP
