# Argo Rollouts adds the candidate's pod-template-hash to frontend-canary's selector
# during a canary. Ignore exactly that runtime field so it is not reported as drift.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-staging
  namespace: argocd
spec:
  project: boutique
  source:
    repoURL: git@github.com:oussema-code/devsecops-platform.git
    targetRevision: main
    path: apps/online-boutique/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
  ignoreDifferences:
  - group: ''
    kind: Service
    name: frontend-canary
    jsonPointers:
    - /spec/selector/rollouts-pod-template-hash
    - /metadata/annotations/argo-rollouts.argoproj.io~1managed-by-rollouts
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-production
  namespace: argocd
spec:
  project: boutique
  source:
    repoURL: git@github.com:oussema-code/devsecops-platform.git
    targetRevision: main
    path: apps/online-boutique/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-production
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: ''
    kind: Service
    name: frontend-canary
    jsonPointers:
    - /spec/selector/rollouts-pod-template-hash
    - /metadata/annotations/argo-rollouts.argoproj.io~1managed-by-rollouts
