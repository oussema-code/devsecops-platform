fullnameOverride: platform-monitoring
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
defaultRules:
  rules:
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    etcd: false
    kubeProxy: false
grafana:
  persistence: {enabled: true, size: 1Gi, storageClassName: standard}
  deploymentStrategy: {type: Recreate}
  additionalDataSources:
    - {name: Loki, uid: loki, type: loki, url: 'http://loki:3100', access: proxy}
    - {name: Tempo, uid: tempo, type: tempo, url: 'http://tempo:3200', access: proxy}
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: 3GB
    enableRemoteWriteReceiver: true
    enableAdminAPI: true
    resources:
      requests: {cpu: 150m, memory: 384Mi}
      limits: {memory: 1400Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 5Gi}}
    additionalScrapeConfigs:
      - job_name: storefront
        scrape_interval: 15s
        metrics_path: /probe
        params: {module: [catalog]}
        static_configs:
          - targets: ['http://frontend.boutique-staging.svc/']
            labels: {environment: staging}
          - targets: ['http://frontend.boutique-production.svc/']
            labels: {environment: production}
        relabel_configs:
          - {source_labels: [__address__], target_label: __param_target}
          - {source_labels: [__param_target], target_label: instance}
          - {target_label: __address__, replacement: 'storefront-probe:9115'}
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: [ReadWriteOnce]
          resources: {requests: {storage: 1Gi}}
additionalPrometheusRulesMap:
  storefront:
    groups:
      - name: storefront
        rules:
          - alert: StorefrontCatalogUnavailable
            expr: (probe_success{job="storefront"} == 0) or (up{job="storefront"} == 0)
            for: 1m
            labels: {severity: page}
            annotations:
              summary: 'Catalog probe failing in {{ $labels.environment }}'
              action: 'Inspect frontend endpoints, Hubble drops, logs and checkout using docs/operations.md.'
          - alert: StorefrontSlow
            expr: avg_over_time(probe_duration_seconds{job="storefront"}[5m]) > 2
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: 'Catalog probe averages over two seconds in {{ $labels.environment }}'
