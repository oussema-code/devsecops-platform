admissionController:
  # Two replicas spread across workers: with Enforce and failurePolicy Fail, a single
  # replica on a lost node would block every Pod replacement in the app namespaces.
  replicas: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: admission-controller
  container:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}
cleanupController: {replicas: 1}
backgroundController: {replicas: 1}
reportsController: {replicas: 1}
