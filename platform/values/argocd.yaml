crds:
  keep: true
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
repoServer:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  service:
    type: ClusterIP
redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
configs:
  cm:
    timeout.reconciliation: 60s
  rbac:
    policy.default: role:readonly
