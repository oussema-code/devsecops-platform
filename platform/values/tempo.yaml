persistence: {enabled: true, size: 3Gi, storageClassName: standard}
tempo:
  retention: 24h
  reportingEnabled: false
  memBallastSizeMbs: 0
  resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {memory: 768Mi}}
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prometheus-operated:9090/api/v1/write
  overrides:
    defaults:
      metrics_generator:
        processors: [span-metrics]
